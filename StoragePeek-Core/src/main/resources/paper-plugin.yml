name: StoragePeek
version: '${project.version}'
main: fr.skynex.storagepeek.StoragePeek
api-version: '1.21'
folia-supported: true
author: Skynex
authors: [Skynex]
website: 'https://www.spigotmc.org/resources/134712'
description: A premium 3D container peeking plugin using ItemDisplays.
prefix: StoragePeek

dependencies:
  server:
    Oraxen:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false
    ItemsAdder:
      load: BEFORE
      required: false
    WorldGuard:
      load: BEFORE
      required: false
    Lands:
      load: BEFORE
      required: false
    GriefPrevention:
      load: BEFORE
      required: false
    BentoBox:
      load: BEFORE
      required: false
    SuperiorSkyblock2:
      load: BEFORE
      required: false
    Towny:
      load: BEFORE
      required: false
    LWC:
      load: BEFORE
      required: false
    Residence:
      load: BEFORE
      required: false
    CraftEngine:
      load: BEFORE
      required: false
    CombatLogX:
      load: BEFORE
      required: false
    CombatTagPlus:
      load: BEFORE
      required: false
    PvPManager:
      load: BEFORE
      required: false
    DeluxeCombat:
      load: BEFORE
      required: false
    GriefDefender:
      load: BEFORE
      required: false
    PlotSquared:
      load: BEFORE
      required: false

permissions:
  storagepeek.admin:
    description: Allows administrative access to StoragePeek (reload command).
    default: op
  storagepeek.toggle:
    description: Allows players to toggle peeking on or off for themselves.
    default: op
  storagepeek.peek:
    description: Allows players to peek into all allowed containers.
    default: op
  storagepeek.filter:
    description: Allows players to use the /storagepeek filter command.
    default: op
  storagepeek.themes:
    description: Allows players to open the themes menu.
    default: op
  storagepeek.bypass.combat:
    description: Allows players to bypass the combat culling check.
    default: op
  storagepeek.bypass.protection:
    description: Allows players to bypass region/land protection checks when peeking containers.
    default: op
